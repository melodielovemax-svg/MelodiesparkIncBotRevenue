services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      MELODIE_LEDGER_PATH: /melodie-data/ledger
      MELODIE_TASKS_PATH: /melodie-tasks
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - C:\\Melodie\\data:/melodie-data:ro
      - C:\\Melodie\\MelodieCLI_Enterprise_RealOnly_Template:/melodie-tasks:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - melodie-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: melodiespark
      POSTGRES_USER: melodie
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U melodie -d melodiespark"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - melodie-network

volumes:
  postgres_data:

networks:
  melodie-network:
    driver: bridge
