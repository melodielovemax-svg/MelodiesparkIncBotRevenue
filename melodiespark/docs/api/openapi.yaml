openapi: 3.1.0
info:
  title: Melodiespark Unified API
  version: 0.1.0
  description: |
    Contract de référence pour le Command Center existant et les domaines de
    consolidation. Les routes de signature wallet représentent une intention ou
    une preuve de contrôle ; elles ne déplacent pas de fonds. Le trading réel,
    les payouts automatiques et la signature de smart contracts ne sont pas
    activés par ce contrat. Les routes /api/v1/executions sont un scaffold
    local : elles déclenchent uniquement le workflow de validation sûr et ne
    diffusent aucune transaction, aucun payout ni aucun ordre de change.
  contact:
    name: Melodiespark engineering
servers:
  - url: http://127.0.0.1:4173
    description: Local development
  - url: https://{host}
    description: Staging or production placeholder
    variables:
      host:
        default: example.invalid
        description: A reviewed, configured host only
security:
  - sessionCookie: []
tags:
  - name: System
    description: Santé, configuration, architecture, sécurité et audit du runtime.
  - name: Identity
    description: Sessions, authentification et contrôle d’accès.
  - name: Revenue
    description: Preuves de revenus, agrégats et export local.
  - name: Commerce
    description: Brouillons de produits soumis à revue humaine.
  - name: Wallet
    description: Vérification de signatures et intentions d’autorisation sans transfert.
  - name: Integrations
    description: Adaptateurs de lecture et webhooks signés.
  - name: Karma
    description: Progression interne sans valeur monétaire.
  - name: Game
    description: Télémétrie de jeu bornée et pseudonymisée.
  - name: Guardians
    description: Profils déterministes et mesures de workflows.
  - name: Automation
    description: Cycles locaux bornés et arrêt sur signal.
paths:
  /api/health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      summary: Vérifie la disponibilité locale
      responses:
        '200':
          description: État de l’application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/config:
    get:
      tags: [System]
      operationId: getPublicConfig
      security: []
      summary: Retourne les capacités non secrètes
      responses:
        '200':
          description: Configuration publique
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
  /api/catalog:
    get:
      tags: [System]
      operationId: getCatalog
      security: []
      summary: Retourne les catalogues monétaires, token et chaîne
      responses:
        '200':
          description: Catalogues de référence non secrets
          content:
            application/json:
              schema:
                type: object
                required: [fiat, tokens, chains]
                properties:
                  fiat: { type: array, items: { type: object } }
                  tokens: { type: array, items: { type: object } }
                  chains: { type: array, items: { type: object } }
  /api/architecture:
    get:
      tags: [System]
      operationId: getArchitecture
      security: []
      summary: Retourne la description des couches et des limites
      responses:
        '200':
          description: Architecture publique du runtime
          content:
            application/json:
              schema:
                type: object
                required: [layers, boundaries]
                properties:
                  layers: { type: array, items: {} }
                  boundaries: { type: array, items: { type: string } }
  /api/auth/status:
    get:
      tags: [Identity]
      operationId: getAuthStatus
      security: []
      summary: Retourne l’état d’authentification
      responses:
        '200':
          description: État de session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
  /api/auth/login:
    post:
      tags: [Identity]
      operationId: login
      security: []
      summary: Ouvre une session locale pour un rôle autorisé
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session créée
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/logout:
    post:
      tags: [Identity]
      operationId: logout
      summary: Ferme la session courante
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/dashboard:
    get:
      tags: [System]
      operationId: getDashboard
      security:
        - {}
      description: L’authentification est requise lorsque REQUIRE_AUTH est actif ; elle est obligatoire en production.
      summary: Retourne l’état agrégé du dashboard
      responses:
        '200':
          description: État dashboard
          content:
            application/json:
              schema:
                type: object
                required: [revenue, guardians, integrations]
                properties:
                  revenue: { type: object }
                  guardians: { type: object }
                  integrations: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/revenue:
    get:
      tags: [Revenue]
      operationId: listRevenue
      security:
        - {}
      description: L’authentification est requise lorsque REQUIRE_AUTH est actif ; elle est obligatoire en production.
      summary: Liste les preuves de revenus
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Événements et résumé
          content:
            application/json:
              schema:
                type: object
                required: [items, summary]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RevenueEvent' }
                  summary: { $ref: '#/components/schemas/RevenueSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/revenue/export.csv:
    get:
      tags: [Revenue]
      operationId: exportRevenueCsv
      summary: Exporte les preuves de revenus
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Export CSV
          content:
            text/csv: {}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/guardians:
    get:
      tags: [Guardians]
      operationId: listGuardians
      security:
        - {}
      description: L’authentification est requise lorsque REQUIRE_AUTH est actif ; elle est obligatoire en production.
      summary: Liste les profils Guardians configurés
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: tier
          in: query
          schema: { type: string, enum: [arc_angel, guardian, sub_guardian] }
        - name: domain
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Registre des profils
          content:
            application/json:
              schema:
                type: object
                required: [items, counts]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Guardian' }
                  counts: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/leaderboard:
    get:
      tags: [Guardians]
      operationId: getLeaderboard
      security:
        - {}
      description: L’authentification est requise lorsque REQUIRE_AUTH est actif ; elle est obligatoire en production.
      summary: Classe les profils sur des exécutions mesurées
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Classement
          content:
            application/json:
              schema:
                type: object
                properties:
                  basis: { type: string }
                  items: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/workflows:
    get:
      tags: [Automation]
      operationId: listWorkflows
      security:
        - {}
      description: L’authentification est requise lorsque REQUIRE_AUTH est actif ; elle est obligatoire en production.
      summary: Liste les cycles bornés
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Historique des cycles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WorkflowHistoryItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/executions:
    get:
      tags: [Automation]
      operationId: listLocalExecutions
      x-melodiespark-status: scaffold
      summary: Liste les exécutions locales liées aux intentions
      description: Le terme execution désigne ici un cycle de validation local, jamais une transaction financière.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [proposed, authorized, queued, running, succeeded, failed, cancelled]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Exécutions locales de l’utilisateur
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ExecutionSummary' } }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Automation]
      operationId: createLocalExecution
      x-melodiespark-status: scaffold
      summary: Crée un cycle local lié à une intention signée
      description: L’opération est idempotente par utilisateur et intention. Elle ne diffuse aucune transaction et ne déplace aucun fonds.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecutionCreateRequest' }
      responses:
        '202':
          description: Cycle local accepté
          content:
            application/json:
              schema:
                type: object
                required: [executionId, status, execution]
                properties:
                  executionId: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/ExecutionStatus' }
                  execution: { $ref: '#/components/schemas/Execution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/executions/{id}:
    get:
      tags: [Automation]
      operationId: getLocalExecution
      x-melodiespark-status: scaffold
      summary: Retourne un cycle local et ses transitions
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: Cycle local
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/executions/{id}/cancel:
    post:
      tags: [Automation]
      operationId: cancelLocalExecution
      x-melodiespark-status: scaffold
      summary: Demande l’annulation d’un cycle local
      description: L’annulation change l’état persistant ; elle n’interrompt pas nécessairement une validation déjà lancée.
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Cycle marqué annulé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Execution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/execution-metrics:
    get:
      tags: [Automation]
      operationId: getLocalExecutionMetrics
      x-melodiespark-status: scaffold
      summary: Retourne les compteurs agrégés des exécutions locales
      responses:
        '200':
          description: Compteurs d’orchestration locale
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ExecutionMetric' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/workflows/run:
    post:
      tags: [Automation]
      operationId: runWorkflow
      summary: Lance un cycle de validation locale
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Résultat du cycle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/products:
    get:
      tags: [Commerce]
      operationId: listProducts
      security:
        - {}
      description: L’authentification est requise lorsque REQUIRE_AUTH est actif ; elle est obligatoire en production.
      summary: Liste les produits en brouillon
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Catalogue de brouillons
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Product' } }
                  notice: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/products/drafts:
    post:
      tags: [Commerce]
      operationId: createProductDraft
      summary: Crée un brouillon de produit soumis à revue
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductDraftRequest' }
      responses:
        '201':
          description: Brouillon créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, const: draft }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/karma:
    get:
      tags: [Karma]
      operationId: getKarma
      security:
        - {}
      description: L’authentification est requise lorsque REQUIRE_AUTH est actif ; elle est obligatoire en production.
      summary: Retourne le registre Karma interne
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Solde et événements Karma
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KarmaResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/karma/award:
    post:
      tags: [Karma]
      operationId: awardKarma
      summary: Ajoute des points Karma idempotemment
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KarmaAwardRequest' }
      responses:
        '201':
          description: Registre mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KarmaAwardResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/integrations/status:
    get:
      tags: [Integrations]
      operationId: getIntegrationStatus
      security:
        - {}
      description: L’authentification est requise lorsque REQUIRE_AUTH est actif ; elle est obligatoire en production.
      summary: Retourne l’état de configuration des intégrations
      responses:
        '200':
          description: État de configuration expurgé
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: object } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/integrations/sync:
    post:
      tags: [Integrations]
      operationId: syncIntegrations
      summary: Lance les synchronisations de lecture configurées
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Résultat de synchronisation
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/market/prices:
    get:
      tags: [Integrations]
      operationId: getMarketPrices
      security: []
      summary: Retourne des prix de référence publics
      responses:
        '200':
          description: Prix de référence
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string }
                  currency: { type: string }
                  fetchedAt: { type: string, format: date-time }
                  prices: { type: object, additionalProperties: { type: number } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/wallet/challenge:
    get:
      tags: [Wallet]
      operationId: getWalletChallenge
      security: []
      summary: Crée un challenge EIP-191 de courte durée
      parameters:
        - $ref: '#/components/parameters/WalletAddress'
        - $ref: '#/components/parameters/ChainId'
      responses:
        '200':
          description: Challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletChallenge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/wallet/verify:
    post:
      tags: [Wallet]
      operationId: verifyWallet
      security: []
      summary: Vérifie la propriété d’une adresse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletVerifyRequest' }
      responses:
        '200':
          description: Adresse vérifiée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletVerification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410': { $ref: '#/components/responses/Expired' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/wallet:
    get:
      tags: [Wallet]
      operationId: listWalletBindings
      security:
        - {}
      description: L’authentification est requise lorsque REQUIRE_AUTH est actif ; elle est obligatoire en production.
      summary: Liste les wallets liés au compte
      responses:
        '200':
          description: Liaisons de wallets et capacités
          content:
            application/json:
              schema:
                type: object
                properties:
                  bindings: { type: array, items: { type: object } }
                  financialActionsEnabled: { type: boolean, const: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/wallet/balance:
    post:
      tags: [Wallet]
      operationId: getWalletBalance
      summary: Lit un solde via RPC en lecture seule
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletBalanceRequest' }
      responses:
        '200':
          description: Solde lu
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/withdrawal-intents:
    post:
      tags: [Wallet]
      operationId: createWithdrawalIntent
      summary: Crée une intention de retrait signée, sans transaction
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawalIntentRequest' }
      responses:
        '201':
          description: Intention créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WithdrawalIntentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/withdrawal-intents/{id}/sign:
    post:
      tags: [Wallet]
      operationId: signWithdrawalIntent
      summary: Attache une signature à une intention
      parameters:
        - $ref: '#/components/parameters/IntentId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignatureRequest' }
      responses:
        '200':
          description: Intention signée en attente de revue
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, const: signature_verified_pending_review }
                  fundsMoved: { type: boolean, const: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/withdrawals:
    get:
      tags: [Wallet]
      operationId: listWithdrawalReviews
      summary: Liste les intentions de retrait pour revue
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Revues
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
                  notice: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/game/telemetry:
    get:
      tags: [Game]
      operationId: listGameTelemetry
      security:
        - {}
      description: L’authentification est requise lorsque REQUIRE_AUTH est actif ; elle est obligatoire en production.
      summary: Liste les événements de télémétrie pseudonymisés
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Game]
      operationId: recordGameTelemetry
      security: []
      summary: Enregistre un événement de jeu borné
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameTelemetryRequest' }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/security/scan:
    get:
      tags: [System]
      operationId: securityScan
      summary: Lance un scan de sécurité local
      responses:
        '200':
          description: Résultats du scan
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/audit:
    get:
      tags: [System]
      operationId: listAuditEvents
      summary: Liste les événements d’audit administrateur
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Événements d’audit
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/webhooks/shopify:
    post:
      tags: [Integrations]
      operationId: receiveShopifyWebhook
      security: []
      summary: Reçoit un webhook Shopify signé
      description: Désactivé sauf si ALLOW_REMOTE_WEBHOOKS et SHOPIFY_WEBHOOK_SECRET sont configurés.
      parameters:
        - $ref: '#/components/parameters/ShopifyHmac'
        - $ref: '#/components/parameters/ShopifyTopic'
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/webhooks/stripe:
    post:
      tags: [Integrations]
      operationId: receiveStripeWebhook
      security: []
      summary: Reçoit un webhook Stripe signé
      description: Désactivé sauf si ALLOW_REMOTE_WEBHOOKS et STRIPE_WEBHOOK_SECRET sont configurés.
      parameters:
        - $ref: '#/components/parameters/StripeSignature'
      requestBody:
        required: true
        content:
          application/json: {}
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ms_session
      description: Cookie de session local HttpOnly ; les mutations authentifiées exigent aussi X-CSRF-Token.
  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 16 }
    WalletAddress:
      name: address
      in: query
      required: true
      schema: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
    ChainId:
      name: chainId
      in: query
      required: true
      schema: { type: integer, enum: [1, 11155111] }
    IntentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExecutionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShopifyHmac:
      name: X-Shopify-Hmac-Sha256
      in: header
      required: true
      description: HMAC-SHA256 Base64 calculé sur le corps brut.
      schema: { type: string, minLength: 44, maxLength: 44 }
    ShopifyTopic:
      name: X-Shopify-Topic
      in: header
      required: false
      schema: { type: string }
    StripeSignature:
      name: Stripe-Signature
      in: header
      required: true
      description: En-tête Stripe-Signature horodaté avec une tolérance de cinq minutes.
      schema: { type: string, minLength: 1 }
  responses:
    Ok:
      description: Opération acceptée
      content:
        application/json:
          schema: { type: object }
    BadRequest:
      description: Entrée invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentification requise
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Action non autorisée
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflit d’état ou d’idempotence
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Expired:
      description: Challenge ou intention expirée
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Ressource non trouvée ou route désactivée
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Limite de requêtes atteinte
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: Corps de requête supérieur à la limite autorisée
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    HealthResponse:
      type: object
      required: [status, version, timestamp]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        mode: { type: string }
        uptimeSeconds: { type: integer }
        timestamp: { type: string, format: date-time }
    PublicConfig:
      type: object
      required: [appName, version, mode, financialActionsEnabled, remoteWebhooksEnabled]
      properties:
        appName: { type: string }
        version: { type: string }
        mode: { type: string }
        authenticationRequired: { type: boolean }
        production: { type: boolean }
        supportedChains: { type: array, items: { type: integer } }
        financialActionsEnabled: { type: boolean, const: false }
        remoteWebhooksEnabled: { type: boolean }
        notice: { type: string }
    AuthStatus:
      type: object
      required: [setupRequired, authenticated]
      properties:
        setupRequired: { type: boolean }
        authenticated: { type: boolean }
        user: { type: [object, 'null'] }
        csrfToken: { type: [string, 'null'] }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 256 }
    LoginResponse:
      type: object
      required: [user, csrfToken]
      properties:
        user: { $ref: '#/components/schemas/User' }
        csrfToken: { type: string }
    User:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, analyst, operator, viewer] }
    RevenueEvent:
      type: object
      required: [id, source, external_id, amount_minor, currency, status, occurred_at, is_demo]
      properties:
        id: { type: string }
        source: { type: string }
        external_id: { type: string }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        gross_minor: { type: integer, format: int64 }
        discount_minor: { type: integer, format: int64 }
        tax_minor: { type: integer, format: int64 }
        status: { type: string }
        occurred_at: { type: string, format: date-time }
        is_demo: { type: boolean }
    RevenueSummary:
      type: object
      properties:
        totalRecords: { type: integer }
        byCurrency: { type: array, items: { type: object } }
    Guardian:
      type: object
      required: [id, name, tier, domain, soul_core, role, enabled, status, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        tier: { type: string, enum: [arc_angel, guardian, sub_guardian] }
        domain: { type: string }
        soul_core: { type: string }
        role: { type: string }
        enabled: { type: integer, enum: [0, 1] }
        status: { type: string }
        created_at: { type: string, format: date-time }
    WorkflowHistoryItem:
      type: object
      required: [id, cycle_id, status, tasks_total, tasks_succeeded, tasks_failed, started_at]
      properties:
        id: { type: string }
        cycle_id: { type: string }
        status: { type: string, enum: [succeeded, partial] }
        tasks_total: { type: integer }
        tasks_succeeded: { type: integer }
        tasks_failed: { type: integer }
        details: { type: object }
        started_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    WorkflowResult:
      type: object
      required: [id, cycleId, status, tasksTotal, tasksSucceeded, tasksFailed, durationMs, results]
      properties:
        id: { type: string }
        cycleId: { type: string }
        status: { type: string, enum: [succeeded, partial] }
        tasksTotal: { type: integer }
        tasksSucceeded: { type: integer }
        tasksFailed: { type: integer }
        durationMs: { type: integer }
        results: { type: array, items: { type: object } }
    Product:
      type: object
      required: [id, sku, title, description, product_type, price_minor, currency, status, source, created_at, updated_at]
      properties:
        id: { type: string }
        sku: { type: string }
        title: { type: string }
        description: { type: string }
        product_type: { type: string, enum: [digital, service, template] }
        price_minor: { type: integer }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { type: string, enum: [draft, review, published, archived] }
        source: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductDraftRequest:
      type: object
      required: [title, sku, priceMinor]
      properties:
        title: { type: string, minLength: 3, maxLength: 140 }
        sku: { type: string, pattern: '^[A-Z0-9][A-Z0-9-]{2,39}$' }
        description: { type: string, maxLength: 4000 }
        type: { type: string, enum: [digital, service, template] }
        priceMinor: { type: integer, minimum: 0, maximum: 100000000 }
    KarmaResponse:
      type: object
      required: [balance, transferable, ledger]
      properties:
        balance: { type: integer }
        transferable: { type: boolean, const: false }
        ledger: { type: array, items: { type: object } }
        notice: { type: string }
    KarmaAwardRequest:
      type: object
      required: [points]
      properties:
        userId: { type: string }
        eventKey: { type: string }
        points: { type: number, minimum: 1, maximum: 100000, description: Le runtime local accepte actuellement un nombre et l’arrondit lors du stockage. }
        reason: { type: string, maxLength: 200 }
    KarmaAwardResponse:
      type: object
      properties:
        id: { type: string }
        points: { type: number }
        balance: { type: integer }
    ExecutionStatus:
      type: string
      enum: [proposed, authorized, queued, running, succeeded, failed, cancelled]
    ExecutionCreateRequest:
      type: object
      description: authorizationIntentId est le nom canonique ; intentId est un alias temporaire du runtime local.
      properties:
        authorizationIntentId: { type: string, format: uuid }
        intentId: { type: string, format: uuid, deprecated: true }
      anyOf:
        - required: [authorizationIntentId]
        - required: [intentId]
    ExecutionSummary:
      type: object
      required: [id, userId, authorizationIntentId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        authorizationIntentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        actorUserId: { type: string }
        errorCode: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        authorizedAt: { type: [string, 'null'], format: date-time }
        queuedAt: { type: [string, 'null'], format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
    ExecutionMetric:
      type: object
      required: [metric, count, updatedAt]
      properties:
        metric:
          type: string
          enum: [success, failure, timeout, cancellation, recovery]
        count: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    ExecutionTransition:
      type: object
      required: [id, toStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        fromStatus:
          oneOf:
            - $ref: '#/components/schemas/ExecutionStatus'
            - type: 'null'
        toStatus: { $ref: '#/components/schemas/ExecutionStatus' }
        actorUserId: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        detailsJson: { type: [string, 'null'] }
        details: { type: [object, 'null'] }
        createdAt: { type: string, format: date-time }
    Execution:
      type: object
      required: [id, executionId, userId, authorizationIntentId, status, transitions]
      properties:
        id: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        userId: { type: string }
        authorizationIntentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        runnerResult: { type: [object, 'null'] }
        errorCode: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        authorizedAt: { type: [string, 'null'], format: date-time }
        queuedAt: { type: [string, 'null'], format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
        transitions: { type: array, items: { $ref: '#/components/schemas/ExecutionTransition' } }
    WalletChallenge:
      type: object
      required: [id, address, chainId, message, hexMessage, expiresAt]
      properties:
        id: { type: string, format: uuid }
        address: { type: string }
        chainId: { type: integer }
        message: { type: string }
        hexMessage: { type: string }
        expiresAt: { type: string, format: date-time }
    WalletVerifyRequest:
      type: object
      required: [challengeId, signature]
      properties:
        challengeId: { type: string, format: uuid }
        signature: { type: string, pattern: '^0x[0-9a-fA-F]+$' }
    WalletVerification:
      type: object
      required: [verified, address, chainId]
      properties:
        verified: { type: boolean, const: true }
        address: { type: string }
        chainId: { type: integer }
        binding: { type: [object, 'null'] }
    WalletBalanceRequest:
      type: object
      required: [address, chainId]
      properties:
        address: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
        chainId: { type: integer, enum: [1, 11155111] }
    WithdrawalIntentRequest:
      type: object
      required: [chainId, amountEth, destination]
      properties:
        chainId: { type: integer, enum: [1, 11155111] }
        amountEth: { type: string, pattern: '^[0-9]+(\.[0-9]{1,18})?$' }
        destination: { type: string, pattern: '^0x[a-fA-F0-9]{40}$' }
    WithdrawalIntentResponse:
      type: object
      required: [id, message, hexMessage, expiresAt, notice]
      properties:
        id: { type: string, format: uuid }
        message: { type: string }
        hexMessage: { type: string }
        expiresAt: { type: string, format: date-time }
        notice: { type: string }
    SignatureRequest:
      type: object
      required: [signature]
      properties:
        signature: { type: string, pattern: '^0x[0-9a-fA-F]+$' }
    GameTelemetryRequest:
      type: object
      description: Le runtime local applique des valeurs par défaut ; le contrat cible doit rendre les quatre identifiants de contexte obligatoires.
      properties:
        clientVersion: { type: string, maxLength: 40 }
        sessionId: { type: string, maxLength: 100 }
        playerId: { type: string, maxLength: 100 }
        eventType: { type: string, maxLength: 80 }
        actNumber: { type: integer, minimum: 1 }
        bossDefeated: { type: string, maxLength: 120 }
        damageDealt: { type: integer, minimum: 0 }
        shattersTriggered: { type: integer, minimum: 0 }
        reactionsTriggered: { type: integer, minimum: 0 }
        phoenixAscensions: { type: integer, minimum: 0 }
        karmaEarned: { type: integer, minimum: 0 }
        payload: { type: object }
