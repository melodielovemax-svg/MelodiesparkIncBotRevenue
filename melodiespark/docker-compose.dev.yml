version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: melodiespark-db
    environment:
      POSTGRES_USER: melodiespark
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: melodiespark_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melodiespark"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - melodiespark-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: melodiespark-cache
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - melodiespark-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: melodiespark-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - melodiespark-net
    restart: unless-stopped

  api:
    image: node:20-alpine
    container_name: melodiespark-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://melodiespark:[REDACTED]@postgres:5432/melodiespark_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_me
      API_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - melodiespark-net
    restart: unless-stopped
    command: sh -c "npm install && npm run dev"
    working_dir: /app
    volumes:
      - ./api:/app

  prometheus:
    image: prom/prometheus:latest
    container_name: melodiespark-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - melodiespark-net
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:latest
    container_name: melodiespark-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - melodiespark-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  melodiespark-net:
    name: melodiespark-net
