services:
  command-center:
    build: .
    init: true
    ports:
      - "127.0.0.1:4173:4173"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
