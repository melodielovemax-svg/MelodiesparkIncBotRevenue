[project]
name = "melodie-platforms-cli"
version = "0.1.0"
description = "Melodiespark Inc. unified CLI gateway for coding agents, AI runtimes and developer platforms."
requires-python = ">=3.12"

dependencies = [
    "typer>=0.12",
    "rich>=13.7"
]

[project.scripts]
platforms = "melodie_platforms.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/melodie_platforms"]

