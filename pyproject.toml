[project]
name = "melodie-platforms-cli"
version = "0.2.0"
description = "Melodiespark Inc. unified Platform CLI, Melodie CLI and evidence-first BotRevenue automation gateway."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "Melodiespark Inc."}
]

dependencies = [
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "pydantic>=2.8,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "build>=1.2,<2",
    "twine>=5,<7",
    "ruff>=0.6,<1"
]

[project.scripts]
platforms = "melodie_platforms.cli:main"
melodie-platforms = "melodie_platforms.cli:main"
botrevenue = "melodie_platforms.botrevenue.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/melodie_platforms"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
