<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MelodieOS Revenue Nexus — operational Web3 control plane for Melodiespark INC." />
  <title>MelodieOS — Revenue Nexus</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div><strong>MelodieOS</strong><span>REVENUE NEXUS</span></div>
      </div>
      <div class="workspace-label">WORKSPACE</div>
      <nav id="nav">
        <button class="nav-item active" data-view="overview">◈ <span>Overview</span></button>
        <button class="nav-item" data-view="revenue">↻ <span>Revenue loops</span></button>
        <button class="nav-item" data-view="products">◇ <span>Products & services</span></button>
        <button class="nav-item" data-view="karma">○ <span>Karma network</span></button>
        <button class="nav-item" data-view="treasury">▣ <span>Wallet treasury</span></button>
        <button class="nav-item" data-view="builder">⌘ <span>Builder studio</span><em>BETA</em></button>
        <button class="nav-item" data-view="audit">✓ <span>Verification & audit</span></button>
      </nav>
      <div class="posture-card">
        <div class="posture-head"><span>SYSTEM POSTURE</span><i></i></div>
        <strong id="postureTitle">No live wallet connected</strong>
        <p id="postureText">Financial actions stay locked until a wallet is verified.</p>
        <button id="reviewControls" class="ghost-btn">◉ Review controls</button>
      </div>
      <div class="sidebar-foot">Melodiespark INC · Web3 Control Plane</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="crumb">Workspace / <strong id="crumbView">Overview</strong></div>
        <div class="top-actions">
          <input id="search" placeholder="Search  ⌘ K" />
          <button id="connectWallet" class="primary-btn">Connect wallet</button>
        </div>
      </header>

      <section id="view-overview" class="view active-view"></section>
      <section id="view-revenue" class="view"></section>
      <section id="view-products" class="view"></section>
      <section id="view-karma" class="view"></section>
      <section id="view-treasury" class="view"></section>
      <section id="view-builder" class="view"></section>
      <section id="view-audit" class="view"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <div id="modal" class="modal hidden"></div>
  <script src="app.js"></script>
</body>
</html>
